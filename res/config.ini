; SwitchSplash config. Re-read on every game launch, so no reboot is needed after editing.
;
; Images: /config/bootsplash/<TITLE ID>/splash.png   (16 hex digits, e.g. 0100152000022000)
;         /config/bootsplash/default/splash.png      (used for titles without their own)
;         /config/bootsplash/hbl/splash.png          (hbmenu via title takeover only)
; Titles with neither get no splash at all.
; Jingle: splash.wav in the same folder as the image (optional).
[bootsplash]
enabled=1
; Measured from launch detection. 0 = as long as the jingle (6000 if there is none).
duration_ms=8500
; Play splash.wav from the same folder as the image.
audio=1
; Jingle volume, 0-100 (on top of the system volume).
volume=100
; Jingle fade-out when the splash time is up (HOME / closing the game always uses 100 ms).
audio_fade_ms=500
; Image fade-out into the game when the splash time is up (0 = disappear at once).
; HOME / closing the game always removes the image immediately.
fade_ms=500
; auto = smooth layer fade if the system supports it, otherwise a 15-step pixel fade.
; pixels = force the pixel fade (testing). none = no fade.
fade_mode=auto
; hbmenu title takeover (launching a game while holding R) uses /config/bootsplash/hbl/
; if it exists, and gets no splash otherwise. 1 = never show a splash for hbmenu.
skip_hbl=0
; Splash length for hbmenu launches (replaces duration_ms; hbmenu is up much faster than a
; game). 0 = as long as the hbl/ jingle.
hbl_duration_ms=2500
; Fill color (RRGGBB) for areas the image doesn't cover and for transparent pixels.
background=000000
; HOME/power press ends the splash immediately.
home_cancel=1
; Include the splash in the snapshot shown while resuming a game. Leave off.
last_frame_stack=0

; ---- Test settings ----
; Framebuffer count: 1 = 2 MiB transient heap, 2 = 4 MiB.
buffers=1
; Show the milestone 2 test screen for every title, instead of the images.
test_pattern=0
; After the hold, present a second frame to test whether a single buffer can be redrawn.
; WARNING: with buffers=1 this may hang with the splash stuck on screen (reboot to recover).
test_redraw=0
