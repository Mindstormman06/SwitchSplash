; SwitchSplash config. Re-read on every game launch, so no reboot is needed after editing.
;
; Images: /config/bootsplash/<TITLE ID>/splash.png   (16 hex digits, e.g. 0100152000022000)
;         /config/bootsplash/default/splash.png      (used for titles without their own)
; Titles with neither get no splash at all.
[bootsplash]
enabled=1
; Measured from launch detection.
duration_ms=6000
; Don't show a splash for hbmenu title takeover (launching a game while holding R).
skip_hbl=1
; Fill color (RRGGBB) for areas the image doesn't cover and for transparent pixels.
background=000000
; HOME/power press ends the splash immediately.
home_cancel=1
; Include the splash in the snapshot shown while resuming a game. Leave off.
last_frame_stack=0

; ---- Test settings ----
; Framebuffer count: 1 = 2 MiB transient heap, 2 = 4 MiB.
buffers=1
; Show the milestone 2 test screen for every title, instead of the images.
test_pattern=0
; After the hold, present a second frame to test whether a single buffer can be redrawn.
; WARNING: with buffers=1 this may hang with the splash stuck on screen (reboot to recover).
test_redraw=0
