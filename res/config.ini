; SwitchSplash config. Re-read on every game launch, so no reboot is needed after editing.
[bootsplash]
enabled=1
; Measured from launch detection. The stock logo usually stays up longer than 3 s.
duration_ms=6000
; Don't show a splash for hbmenu title takeover (launching a game while holding R).
skip_hbl=1

; ---- Milestone 2 test settings ----
; Framebuffer count: 1 = 2 MiB transient heap, 2 = 4 MiB.
buffers=1
; Background color, RRGGBB.
color=203060
; Draws two test stripes plus a test box in the bottom-right corner (see README).
alpha_test=1
; After the hold, present a second frame to test whether a single buffer can be redrawn.
; WARNING: with buffers=1 this may hang with the color stuck on screen (reboot to recover).
test_redraw=0

; ---- Load-time visibility diagnostics ----
; Layer size in display coordinates (1920x1080 = full screen; 1280x720 = top-left 2/3, as in build 1).
layer_w=1920
layer_h=1080
; HOME/power press ends the splash.
home_cancel=1
; Include the layer in the "last frame" snapshot AM shows when you leave/resume an app.
last_frame_stack=1
